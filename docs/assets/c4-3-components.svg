<text x="645.0" y="691.5" font-size="12" font-weight="bold" fill="#404040" text-anchor="middle">ФИО, email</text>
<rect x="1031.3" y="153.1" width="117.5" height="33.9" fill="#FFFFFF"/>
<text x="1090.0" y="166.8" font-size="12" font-weight="bold" fill="#404040" text-anchor="middle">Подпись запроса</text>
<text x="1090.0" y="181.4" font-size="11" font-weight="normal" fill="#404040" text-anchor="middle">[csptest -sign]</text>
