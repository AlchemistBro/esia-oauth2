<text x="1365.0" y="305.9" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Подпись и проверка ГОСТ</text>
<rect x="1230" y="560" width="270" height="170" rx="12" fill="#8B8496" stroke="#6E6879" stroke-width="1.5"/>
<text x="1365.0" y="631.5" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ЕСИА</text>
