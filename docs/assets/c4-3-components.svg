<circle cx="130.0" cy="335.7" r="35.7" fill="#08427B" stroke="#06315C" stroke-width="1.5"/>
<text x="130.0" y="419.1" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Пользователь</text>
<text x="130.0" y="435.6" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Person]</text>
<text x="130.0" y="458.6" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Браузер</text>
<rect x="330" y="40" width="250" height="160" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="455.0" y="90.8" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Обработчик входа</text>
<text x="455.0" y="107.3" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: GET /auth/esia/login]</text>
<text x="455.0" y="130.3" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Создаёт state и ID браузера,</text>
<text x="455.0" y="145.9" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">ставит cookie __Host-, редирект в</text>
<text x="455.0" y="161.6" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">ЕСИА</text>
<rect x="330" y="300" width="210" height="160" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="435.0" y="358.6" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Хранилище state</text>
<text x="435.0" y="375.1" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: in-memory, TTL 10 мин]</text>
<text x="435.0" y="398.1" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Одноразовый state, привязан</text>
<text x="435.0" y="413.8" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">к браузеру</text>
<rect x="330" y="560" width="260" height="170" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="460.0" y="615.8" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Обработчик callback</text>
<text x="460.0" y="632.3" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: GET /auth/esia/callback]</text>
<text x="460.0" y="655.3" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Сверяет cookie и state, обменивает</text>
<text x="460.0" y="670.9" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">код, проверяет токен, собирает</text>
<text x="460.0" y="686.6" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">профиль</text>
<rect x="700" y="40" width="260" height="170" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="830.0" y="95.8" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OAuth-клиент ЕСИА</text>
<text x="830.0" y="112.3" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: go-api-epgu/aas]</text>
<text x="830.0" y="135.3" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Строит и подписывает запрос,</text>
<text x="830.0" y="150.9" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">обменивает код. Исправлен баг</text>
<text x="830.0" y="166.6" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">permissions=null</text>
<rect x="700" y="330" width="260" height="160" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="830.0" y="388.6" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Валидатор ID token</text>
<text x="830.0" y="405.1" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: id_token.go]</text>
<text x="830.0" y="428.1" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">Подпись + alg, typ, iss, aud, sub, exp,</text>
<text x="830.0" y="443.8" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">nbf, iat</text>
<rect x="700" y="620" width="260" height="150" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="830.0" y="681.5" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Клиент REST API</text>
<text x="830.0" y="698.0" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">[Component: resource_api.go]</text>
<text x="830.0" y="720.9" font-size="12.5" font-weight="normal" fill="#D9ECF8" text-anchor="middle">ФИО: /rs/prns, email: /rs/prns/ctts</text>
<rect x="1230" y="200" width="270" height="160" rx="12" fill="#23A2D9" stroke="#0E7DAD" stroke-width="1.5"/>
<text x="1365.0" y="266.5" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">КриптоПро CSP</text>
