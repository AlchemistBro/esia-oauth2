<text x="130.0" y="206.8" font-size="12" font-weight="bold" fill="#404040" text-anchor="middle">Начинает вход</text>
<text x="130.0" y="221.4" font-size="11" font-weight="normal" fill="#404040" text-anchor="middle">[HTTPS]</text>
