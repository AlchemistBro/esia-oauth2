<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description" font-family="Helvetica, Arial, sans-serif">
  <title id="title">ESIA OAuth2</title>
  <desc id="description">Вход через Госуслуги на Go: ГОСТ-подпись через КриптоПро и проверенный ID token</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08427B"/>
      <stop offset="1" stop-color="#1168BD"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L12,6 L0,11 z" fill="#D9ECF8"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <text x="60" y="92" fill="#FFFFFF" font-size="46" font-weight="bold">ESIA OAuth2</text>
  <text x="60" y="132" fill="#D9ECF8" font-size="20">Вход через Госуслуги на Go: ГОСТ-подпись через КриптоПро</text>
  <text x="60" y="160" fill="#D9ECF8" font-size="20">и криптографически проверенный ID token из коробки</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <rect x="60" y="200" width="190" height="62" rx="10" fill="#23A2D9" stroke="#0E7DAD"/>
    <text x="155" y="236">Браузер</text>
    <rect x="330" y="200" width="230" height="62" rx="10" fill="#23A2D9" stroke="#0E7DAD"/>
    <text x="445" y="228">Callback-сервис</text>
    <text x="445" y="248" font-size="12" font-weight="normal" fill="#D9ECF8">state · подпись · проверка</text>
    <rect x="640" y="200" width="190" height="62" rx="10" fill="#8B8496" stroke="#6E6879"/>
    <text x="735" y="236">ЕСИА</text>
  </g>
  <path d="M250,231 H330" stroke="#D9ECF8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560,231 H640" stroke="#D9ECF8" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#FFFFFF" font-size="15">
    <text x="900" y="214">✓ ГОСТ Р 34.10-2012</text>
    <text x="900" y="240">✓ Проверка ID token</text>
    <text x="900" y="266">✓ ФИО и email по согласию</text>
  </g>
</svg>
