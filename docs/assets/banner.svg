<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">ESIA OAuth2 Callback Service</title>
  <desc id="description">Neutral diagram showing Client, Callback Service and ESIA</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66d9ef"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <text x="600" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    ESIA OAuth2 Callback Service
  </text>
  <text x="600" y="108" fill="#a8b3c7" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    Go · OAuth 2.0 / OpenID Connect · CryptoPro / GOST
  </text>

  <g font-family="Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">
    <rect x="95" y="165" width="220" height="78" rx="14" fill="#1f2f4d" stroke="#3f5579"/>
    <text x="205" y="212" fill="#f8fafc">Client</text>

    <rect x="470" y="150" width="260" height="108" rx="16" fill="#123f52" stroke="#66d9ef" stroke-width="2"/>
    <text x="600" y="195" fill="#f8fafc">Callback Service</text>
    <text x="600" y="225" fill="#9ee7f3" font-size="16" font-weight="400">state · token · validation</text>

    <rect x="885" y="165" width="220" height="78" rx="14" fill="#1f2f4d" stroke="#3f5579"/>
    <text x="995" y="212" fill="#f8fafc">ESIA</text>
  </g>

  <path d="M 325 204 L 452 204" fill="none" stroke="#66d9ef" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 748 204 L 867 204" fill="none" stroke="#66d9ef" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
